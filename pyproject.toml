[project]
name = "smog-forecast-mlops"
version = "1.0.0"
description = "Serving and monitoring the Pakistan smog forecaster: FastAPI service, Docker image, live accuracy and drift monitoring."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Anas Khan" }]
license = { text = "MIT" }
dependencies = [
    "pakistan-smog-forecast",
    "scikit-learn==1.9.1",        # must match the version the model was trained with
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "requests>=2.31",
    "plotly>=5.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
# The model package, pinned to the exact commit that produced the deployed artifact.
pakistan-smog-forecast = { git = "https://github.com/anascs12/pakistan-smog-forecast", rev = "5d490e669fb42dd32c3ec1a183065d7c4ef6948f" }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smog_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/smog_service/report.py" = ["E501"]  # long lines are HTML template markup
